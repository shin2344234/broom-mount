; Broomy for Crimson Desert exe 1.0.0.3392 (the DLC build).
;
; Broomy is a flying broom with a radial wedge of its own. The plugin writes
; what it does to Broomy.log, next to it in bin64. The sessions before
; it are Broomy.01.log upwards, newest first.

;@mod name="Broomy" author=Seth live=0

[settings]

; Give Broomy to a save that does not have it yet. A few seconds after a
; save loads, the plugin looks for Broomy among your mounts; when it is not
; there, the next unowned wild horse nearby joins as Broomy. Read at
; startup.
;@ type=bool true=1 false=0 label="Give Broomy"
GiveBroomy=1

; Broomy's speed on the ground, in percent of the Wyvern's. At 100 it walks
; at 5.6 m/s and runs at 11; the default 250 is two and a half times that.
; Read at startup.
;@ type=int min=10 max=1000 label="Ground speed (% of the Wyvern's)"
GroundSpeed=250

; Broomy's speed in the air, in percent of the Wyvern's. At 100 it cruises at
; 25 m/s; the default 250 cruises at 62.5. Read at startup.
;@ type=int min=10 max=1000 label="Flight speed (% of the Wyvern's)"
FlightSpeed=250

; The boost, which is the run key in the air, in percent of Broomy's flight
; speed. The default 200 boosts at twice the cruise. Read at startup.
;@ type=int min=100 max=500 label="Boost speed (% of flight speed)"
BoostSpeed=200

; How fast Broomy climbs and dives, in percent of the Wyvern's. Read at
; startup.
;@ type=int min=10 max=1000 label="Climb speed (% of the Wyvern's)"
ClimbSpeed=200

; On a controller, Broomy's speed follows how far the left stick is pushed:
; the lightest push moves at this percent of the full speed, and pushing all
; the way gives the full speed. 100 keeps one speed whatever the push. The
; boost and the keyboard always move at full speed. Read at startup.
;@ type=int min=5 max=100 label="Speed at the lightest stick push (%)"
SlowestPush=15
